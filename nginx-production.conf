# ─── Host-level Nginx for AI Voice Assistant ────────────────────────────────
# Place this file at: /etc/nginx/sites-available/ai-voice-assistant
# Then: sudo ln -s /etc/nginx/sites-available/ai-voice-assistant /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# ─── Redirect HTTP → HTTPS ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name 160.30.207.153;  # replace with yourdomain.com when ready

    # Uncomment when using certbot with a domain:
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    return 301 https://$host$request_uri;
}

# ─── HTTPS (SSL) ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 160.30.207.153;  # replace with yourdomain.com when ready

    # ── SSL Certificates ──────────────────────────────────────────────────────
    # With a domain (Let's Encrypt via certbot):
    #   sudo certbot --nginx -d yourdomain.com
    # Then replace paths below:
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # For IP-only (self-signed, not recommended for prod):
    #   sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #     -keyout /etc/ssl/private/ai-voice.key \
    #     -out /etc/ssl/certs/ai-voice.crt
    # ssl_certificate     /etc/ssl/certs/ai-voice.crt;
    # ssl_certificate_key /etc/ssl/private/ai-voice.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Vapi Webhook → Backend ────────────────────────────────────────────────
    # VAPI calls this directly — routes to Docker backend on 8001
    location /vapi-webhook {
        proxy_pass         http://127.0.0.1:8001/vapi-webhook;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Everything else → Frontend (React + Docker nginx) ────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
